<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>meet.</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="meet.">
    
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>

    <!-- Room Selection Gate -->
    <div class="setup-box" id="loginSetup">
        <h2 style="margin-top:0; font-weight: 600; font-size: 28px; color: #ff007f; text-shadow: 0 0 5px #ff007f; letter-spacing: -1px;">meet.</h2>
        <input type="text" id="roomInput" placeholder="Room Name" required autocorrect="off" autocapitalize="none">
        <input type="text" id="nameInput" placeholder="Your Name" required>
        
        <input type="password" id="passwordInput" placeholder="Password (Optional)">
        
        <button id="joinBtn" class="primary-btn" onclick="initiateCall()">Connect Session</button>
    </div>

    <!-- Active Room Header -->
    <div id="room-header">
        <div>Channel: <strong id="headerRoomLabel" style="color:#00f0ff; text-shadow: 0 0 5px #00f0ff;">-</strong></div>
        <button class="share-btn" onclick="copyShareLink()">Copy Link</button>
    </div>

    <!-- Main Viewport Canvas -->
    <div id="video-container">
        <div class="grid" id="videoGrid"></div>
        <div id="camMenu"></div>
        <div id="reactionMenu"></div>
        <div id="micMenu"></div>

        <!-- Slide-Out Ephemeral Chat & File Drawer -->
        <div id="chatDrawer" class="chat-drawer">
            <div class="chat-header">
                <div class="chat-title">
                    <span>TRANSMISSIONS</span>
                    <span class="chat-subtitle">Chat: 1m TTL | Files: 10m TTL</span>
                </div>
                <button class="chat-close-btn" onclick="toggleChat()">✕</button>
            </div>
            
            <div id="chatStream" class="chat-stream"></div>

            <div id="uploadProgressBar" class="upload-progress-container">
                <div id="uploadProgressFill" class="upload-progress-fill"></div>
            </div>

            <form id="chatForm" class="chat-input-bar" onsubmit="handleChatSubmit(event)">
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
                <button type="button" class="chat-clip-btn" title="Share file (up to 200MB)" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="text" id="chatInput" placeholder="Type transmission..." autocomplete="off">
                <button type="submit" class="chat-send-btn">➤</button>
            </form>
        </div>
    </div>

    <!-- Controls Dock -->
    <div id="control-dock">
        <button id="btnMic" class="dock-btn" onclick="toggleMic()">Mic</button>
        <button id="btnCam" class="dock-btn" onclick="toggleCam()">Cam</button>
        <button id="btnReact" class="dock-btn" onclick="toggleReactionMenu()">React</button>
        <button id="btnChat" class="dock-btn" onclick="toggleChat()">
            Chat
            <span id="chatBadge" class="chat-badge"></span>
        </button>
        <button id="btnScreen" class="dock-btn" onclick="toggleScreenShare()">Share</button>
        <button id="btnFullscreen" class="dock-btn" onclick="toggleFullscreen()">Full</button>
        <button class="dock-btn leave" onclick="terminateSession(true)">Leave</button>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
