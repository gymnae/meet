<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>meet.</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="meet.">
    
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316171f'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e2a0b4'/%3E%3Cstop offset='.5' stop-color='%23a9cbb6'/%3E%3Cstop offset='1' stop-color='%23a4c3d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='14' y='20' width='36' height='24' rx='8' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='url(%23g)'/%3E%3C/svg%3E">
    
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/pixel-bg.css">
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
</head>
<body>
    <!-- Glassmorphism pastel orbs background (dull rainbow + soft cyberpunk) -->
    <div class="px-bg orb-bg" aria-hidden="true">
        <div class="px-bg__orb orb-bg__orb orb--1"></div>
        <div class="px-bg__orb orb-bg__orb orb--2"></div>
        <div class="px-bg__orb orb-bg__orb orb--3"></div>
        <div class="px-bg__orb orb-bg__orb orb--4"></div>
        <div class="px-bg__orb orb-bg__orb orb--5"></div>
        <div class="px-bg__orb orb-bg__orb orb--6"></div>
        <div class="px-bg__grid orb-bg__grid"></div>
        <div class="px-bg__sheen orb-bg__sheen"></div>
    </div>

    <!-- Room Selection Gate -->
    <div class="setup-box" id="loginSetup">
        <h2 style="margin-top:0; font-weight: 700; font-size: 30px; letter-spacing: -1px;">meet.</h2>
        <input type="text" id="roomInput" placeholder="Room Name" required autocorrect="off" autocapitalize="none">
        <input type="text" id="nameInput" placeholder="Your Name" required>
        
        <input type="password" id="passwordInput" placeholder="Password (Optional)">
        
        <button id="joinBtn" class="primary-btn" onclick="initiateCall()">Connect Session</button>
    </div>
    <a class="repo-link" id="repoLink" href="https://github.com/gymnae/meet" target="_blank" rel="noopener noreferrer" aria-label="Open project repository on GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M8 0C3.58 0 0 3.67 0 8.2c0 3.63 2.29 6.71 5.47 7.8.4.07.55-.18.55-.39 0-.19-.01-.83-.01-1.5-2.01.38-2.53-.51-2.69-.98-.09-.24-.48-.98-.82-1.18-.28-.16-.68-.56-.01-.57.63-.01 1.08.6 1.23.85.72 1.24 1.87.89 2.33.68.07-.54.28-.89.51-1.09-1.78-.21-3.64-.91-3.64-4.05 0-.89.31-1.62.82-2.19-.08-.21-.36-1.05.08-2.19 0 0 .67-.22 2.2.84a7.4 7.4 0 0 1 4 0c1.53-1.06 2.2-.84 2.2-.84.44 1.14.16 1.98.08 2.19.51.57.82 1.3.82 2.19 0 3.15-1.87 3.84-3.65 4.05.29.26.54.76.54 1.54 0 1.11-.01 2.01-.01 2.29 0 .21.15.47.55.39A8.22 8.22 0 0 0 16 8.2C16 3.67 12.42 0 8 0Z"></path>
        </svg>
    </a>

    <!-- Active Room Header -->
    <div id="room-header">
        <div>Channel: <strong id="headerRoomLabel">-</strong></div>
        <button class="share-btn" onclick="copyShareLink()">Copy Link</button>
    </div>

    <!-- Main Viewport Canvas -->
    <div id="video-container">
        <div class="grid" id="videoGrid"></div>
        <div id="camMenu"></div>
        <div id="reactionMenu"></div>
        <div id="micMenu"></div>

        <!-- Slide-Out Ephemeral Chat & File Drawer -->
        <div id="chatDrawer" class="chat-drawer">
            <div class="chat-header">
                <div class="chat-title">
                    <span>SIGNALS</span>
                    <span class="chat-subtitle">Chat: 1m TTL | Files: 10m TTL</span>
                </div>
                <button class="chat-close-btn" onclick="toggleChat()">✕</button>
            </div>
            
            <div id="chatStream" class="chat-stream"></div>

            <div id="uploadProgressBar" class="upload-progress-container">
                <div id="uploadProgressFill" class="upload-progress-fill"></div>
            </div>

            <form id="chatForm" class="chat-input-bar" onsubmit="handleChatSubmit(event)">
                <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(event)">
                <button type="button" class="chat-clip-btn" title="Share file (up to 200MB)" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="text" id="chatInput" placeholder="Type a signal..." autocomplete="off">
                <button type="submit" class="chat-send-btn">➤</button>
            </form>
        </div>
    </div>

    <!-- Controls Dock -->
    <div id="control-dock">
        <button id="btnMic" class="dock-btn" onclick="toggleMic()">Mic</button>
        <button id="btnCam" class="dock-btn" onclick="toggleCam()">Cam</button>
        <button id="btnReact" class="dock-btn" onclick="toggleReactionMenu()">React</button>
        <button id="btnChat" class="dock-btn" onclick="toggleChat()">
            Chat
            <span id="chatBadge" class="chat-badge"></span>
        </button>
        <button id="btnScreen" class="dock-btn" onclick="toggleScreenShare()">Share</button>
        <button id="btnRec" class="dock-btn desktop-only" onclick="toggleRecording()">Rec</button>
        <button id="btnFullscreen" class="dock-btn" onclick="toggleFullscreen()">Full</button>
        <button class="dock-btn leave" onclick="terminateSession(true)">Leave</button>
    </div>

    <script type="module" src="/js/main.js"></script>
</body>
</html>
