<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>schnackn. — status</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316171f'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e2a0b4'/%3E%3Cstop offset='.5' stop-color='%23a9cbb6'/%3E%3Cstop offset='1' stop-color='%23a4c3d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='14' y='20' width='36' height='24' rx='8' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
    <style>
        body { position: static; display: flex; overflow: auto; padding: var(--s-4); }
        .status-page {
            position: relative;
            z-index: var(--z-app);
            width: min(100%, 360px);
            margin: auto;
            padding: var(--s-8) var(--s-6) var(--s-6);
            background: var(--surface-1);
            border: var(--stroke) solid var(--role-brand);
            box-shadow: var(--elev-hero);
        }
        /* diagonal hazard strip, same as the join card */
        .status-page::before {
            content: "";
            position: absolute; top: 0; left: 0; right: 0; height: 6px;
            color: var(--role-brand);
            background: var(--stripe);
            opacity: .9;
        }
        .status-page h2 {
            margin: 0 0 var(--s-5);
            font-size: var(--fs-display);
            line-height: var(--lh-tight);
            font-weight: 700;
        }
        .status-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--s-2);
            margin-bottom: var(--s-5);
        }
        .status-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--s-1);
            padding: var(--s-3) var(--s-2);
            background: var(--surface-2);
            border: var(--stroke) solid var(--line);
        }
        .status-value {
            font: 700 var(--fs-display)/var(--lh-tight) var(--font-mono);
            color: var(--role-info);
        }
        .status-label {
            font-size: var(--fs-small);
            line-height: var(--lh-tight);
            color: var(--text-2);
            text-align: center;
        }
        .status-back { font-size: var(--fs-small); }
        @supports (corner-shape: notch) {
            .status-page, .status-stat { border-radius: var(--notch); corner-shape: notch; }
        }
    </style>
</head>
<body>
    <div class="status-page">
        <h2>schnackn. status</h2>

        <div class="status-dashboard">
            <div class="status-stat">
                <span class="status-value" id="statCurrentUsers">–</span>
                <span class="status-label">Current users</span>
            </div>
            <div class="status-stat">
                <span class="status-value" id="statActiveChannels">–</span>
                <span class="status-label">Active channels</span>
            </div>
            <div class="status-stat">
                <span class="status-value" id="statTotalChannels">–</span>
                <span class="status-label">Channels (all time)</span>
            </div>
            <div class="status-stat">
                <span class="status-value" id="statTotalUsers">–</span>
                <span class="status-label">Users (all time)</span>
            </div>
        </div>

        <a class="status-back" href="/">← back to schnackn.</a>
    </div>

    <script>
        const set = (id, val) => { document.getElementById(id).textContent = val; };

        function refresh() {
            fetch('/api/status')
                .then(r => r.json())
                .then(s => {
                    set('statCurrentUsers', s.currentUsers);
                    set('statActiveChannels', s.activeChannels.length);
                    set('statTotalChannels', s.totalChannels);
                    set('statTotalUsers', s.totalUsers);
                })
                .catch(() => {
                    ['statCurrentUsers', 'statActiveChannels', 'statTotalChannels', 'statTotalUsers']
                        .forEach(id => set(id, '–'));
                });
        }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
