<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>meet. — status</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316171f'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e2a0b4'/%3E%3Cstop offset='.5' stop-color='%23a9cbb6'/%3E%3Cstop offset='1' stop-color='%23a4c3d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='14' y='20' width='36' height='24' rx='8' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='6' fill='url(%23g)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/pixel-bg.css">
    <style>
        body { position: static; display: flex; overflow: auto; }
        .status-page {
            background: var(--glass);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            padding: 32px 30px;
            border-radius: var(--r);
            width: 340px;
            max-width: 92vw;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
            margin: auto;
        }
        .status-page h2 {
            margin: 0 0 20px;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: -1px;
        }
        .status-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }
        .status-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-sm);
            padding: 10px 6px;
        }
        .status-value {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--rainbow);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--txt-dim);
            text-align: center;
        }
        .status-back {
            display: inline-block;
            margin-top: 6px;
            color: var(--txt-dim);
            font-size: 13px;
            text-decoration: none;
            border-bottom: 1px solid var(--glass-border);
        }
        .status-back:hover { color: var(--txt); }
    </style>
</head>
<body>
    <div class="px-bg orb-bg" aria-hidden="true">
        <div class="px-bg__orb orb-bg__orb orb--1"></div>
        <div class="px-bg__orb orb-bg__orb orb--2"></div>
        <div class="px-bg__orb orb-bg__orb orb--3"></div>
        <div class="px-bg__orb orb-bg__orb orb--4"></div>
        <div class="px-bg__orb orb-bg__orb orb--5"></div>
        <div class="px-bg__orb orb-bg__orb orb--6"></div>
        <div class="px-bg__grid orb-bg__grid"></div>
        <div class="px-bg__sheen orb-bg__sheen"></div>
    </div>

    <div class="status-page">
        <h2>meet. status</h2>

        <div class="status-dashboard">
            <div class="status-stat">
                <span class="status-value" id="statCurrentUsers">–</span>
                <span class="status-label">Current Users</span>
            </div>
            <div class="status-stat">
                <span class="status-value" id="statActiveChannels">–</span>
                <span class="status-label">Active Channels</span>
            </div>
            <div class="status-stat">
                <span class="status-value" id="statTotalChannels">–</span>
                <span class="status-label">Channels (All Time)</span>
            </div>
            <div class="status-stat">
                <span class="status-value" id="statTotalUsers">–</span>
                <span class="status-label">Users (All Time)</span>
            </div>
        </div>

        <a class="status-back" href="/">← back to meet.</a>
    </div>

    <script>
        const set = (id, val) => { document.getElementById(id).textContent = val; };

        function refresh() {
            fetch('/api/status')
                .then(r => r.json())
                .then(s => {
                    set('statCurrentUsers', s.currentUsers);
                    set('statActiveChannels', s.activeChannels.length);
                    set('statTotalChannels', s.totalChannels);
                    set('statTotalUsers', s.totalUsers);
                })
                .catch(() => {
                    ['statCurrentUsers', 'statActiveChannels', 'statTotalChannels', 'statTotalUsers']
                        .forEach(id => set(id, '–'));
                });
        }

        refresh();
        setInterval(refresh, 15000);
    </script>
</body>
</html>
